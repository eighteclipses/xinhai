plugins { id 'com.android.application' }
android {
    namespace 'com.xinhai.study'
    compileSdk 35
    buildToolsVersion '35.0.0'
    buildFeatures { buildConfig true }
    defaultConfig { buildConfigField 'boolean', 'COMMERCIAL_EDITION', 'false' }
    defaultConfig { applicationId 'com.xinhai.study.source'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.2.35-source.0'; manifestPlaceholders = [appLabel:'心海共学 · 源码版'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs = ['../../dist/mobile-web'] } }
    androidResources { noCompress += ['mp4','webm','ogg','mp3','wav','flac','m4a'] }
    signingConfigs {
        localRelease {
            if (System.getenv('XINHAI_SIGNING_STORE')) {
                storeFile file(System.getenv('XINHAI_SIGNING_STORE'))
                storePassword System.getenv('XINHAI_SIGNING_PASSWORD')
                keyAlias 'xinhai'
                keyPassword System.getenv('XINHAI_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes { debug { debuggable true; applicationIdSuffix '.qa'; manifestPlaceholders = [appLabel:'心海共学 · 源码调试'] }; release { minifyEnabled false; signingConfig signingConfigs.localRelease } }
}
